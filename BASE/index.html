<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AURA | Modern Living</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Specific index styles to keep styles.css clean */
    .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
    .product-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
    .product-image-container { height: 310px; position: relative; }
    .product-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
    .product-card:hover .product-image { transform: scale(1.05); }
    .product-badge { position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,0.95); padding: 4px 10px; border-radius: 50px; font-size: 11px; font-weight: 700; }
    .product-details { padding: 22px 20px; display: flex; flex-direction: column; }
    .add-to-cart-btn { background: var(--color-accent); color: white; padding: 10px 18px; border-radius: 50px; font-size: 13px; border: none; cursor: pointer; transition: background 0.3s ease; }
    .add-to-cart-btn:hover { background: var(--color-accent-hover); }
    
    @media (max-width: 1024px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .product-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const formatINR = (amount) => {
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount);
    };

    const INITIAL_PRODUCTS = [
      { id: 'velvet-sofa', name: 'Velvet Cloud Sofa', category: 'Living Room', price: 120450, specs: 'Deep Olive • Velvet', badge: 'Bestseller', image: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=800&q=80' },
      { id: 'brass-lamp', name: 'Minimalist Brass Arc Lamp', category: 'Lighting', price: 4900, specs: 'Brushed Brass', badge: 'New Arrival', image: 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=800&q=80' },
      { id: 'oak-coffee-table', name: 'Solstice Oak Coffee Table', category: 'Tables', price: 89000, specs: 'Natural White Oak', badge: 'Handcrafted', image: 'https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&w=800&q=80' },
      { id: 'kyoto-lounge-chair', name: 'Bouclé Kyoto Lounge Chair', category: 'Armchairs', price: 115320, specs: 'Oatmeal Bouclé', badge: 'Designer Pick', image: 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=800&q=80' }
    ];

    function App() {
      // 1. Global State
      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('aura_cart');
        return saved ? JSON.parse(saved) : [];
      });
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isChatOpen, setIsChatOpen] = useState(false);
      
      // 2. Chatbot State
      const [chatInput, setChatInput] = useState('');
      const [messages, setMessages] = useState([{ sender: 'bot', text: 'Hello! How can I help you design your space today?', image: null }]);
      const [isTyping, setIsTyping] = useState(false);
      const messagesEndRef = useRef(null);

      // Effects
      useEffect(() => {
        localStorage.setItem('aura_cart', JSON.stringify(cart));
        if (window.lucide) window.lucide.createIcons();
      }, [cart]);

      useEffect(() => {
        if (isChatOpen && window.lucide) window.lucide.createIcons();
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isChatOpen]);

      // Cart Functions
      const addToCart = (product) => {
        setCart(prev => {
          const exists = prev.find(i => i.id === product.id);
          if (exists) return prev.map(i => i.id === product.id ? { ...i, quantity: i.quantity + 1 } : i);
          return [...prev, { ...product, quantity: 1 }];
        });
        setIsCartOpen(true);
      };

      const updateQty = (id, delta) => setCart(prev => prev.map(i => i.id === id ? { ...i, quantity: Math.max(1, i.quantity + delta) } : i));
      const remove = (id) => setCart(prev => prev.filter(i => i.id !== id));

      const subtotal = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      const count = cart.reduce((acc, item) => acc + item.quantity, 0);

      // Chatbot Functions
      const sendMessage = async () => {
        if (!chatInput.trim()) return;
        
        const userMsg = chatInput.trim();
        setMessages(prev => [...prev, { sender: 'user', text: userMsg, image: null }]);
        setChatInput('');
        setIsTyping(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMsg })
          });
          const data = await res.json();
          
          setMessages(prev => [...prev, { sender: 'bot', text: data.reply, image: data.imageUrl }]);
        } catch (err) {
          setMessages(prev => [...prev, { sender: 'bot', text: 'Sorry, I am having trouble connecting to the design server right now. Is the server running?' }]);
        } finally {
          setIsTyping(false);
        }
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter') sendMessage();
      };

      return (
        <div>
          {/* Top Bar */}
          <div className="announcement-bar">
            <span>India Edition: Complimentary White-Glove Installation on all Orders Over ₹50,000</span>
            <span className="announcement-badge">PAN-INDIA</span>
          </div>

          {/* Navigation */}
          <header className="site-header">
            <div className="nav-container">
              <div className="brand-logo" style={{cursor: 'pointer'}} onClick={() => window.scrollTo(0,0)}>
                <div className="brand-mark">A</div>
                <span className="brand-title">Aura Studio</span>
              </div>
              <nav><ul className="nav-menu">
                <li><a href="#shop" className="nav-link">Shop</a></li>
                <li><a href="#" className="nav-link">Collections</a></li>
                <li><a href="#" className="nav-link">About</a></li>
              </ul></nav>
              <button className="icon-btn" onClick={() => setIsCartOpen(true)}>
                <i data-lucide="shopping-bag"></i>
                {count > 0 && <span className="cart-counter">{count}</span>}
              </button>
            </div>
          </header>

          {/* Hero */}
          <section className="hero-section">
            <div className="hero-card">
              <div>
                <div className="hero-tagline"><i data-lucide="sparkles" style={{width: 14}}></i> 2025 Architecture Collection</div>
                <h1 className="hero-title">Design Your <em>Dream Space</em> with Tactile Elegance.</h1>
                <button className="btn-primary" onClick={() => document.getElementById('shop').scrollIntoView({behavior: 'smooth'})}>Shop Collection</button>
              </div>
              <div className="hero-image-wrapper">
                <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1200&q=85" alt="Modern Living Room"/>
              </div>
            </div>
          </section>

          {/* Stats */}
          <section className="stats-strip">
            <div className="stat-box"><div className="stat-num">10k+</div><div style={{color: 'var(--color-text-muted)'}}>Happy Homes</div></div>
            <div className="stat-box"><div className="stat-num">500+</div><div style={{color: 'var(--color-text-muted)'}}>Design Awards</div></div>
            <div className="stat-box"><div className="stat-num">100%</div><div style={{color: 'var(--color-text-muted)'}}>Sustainable Wood</div></div>
            <div className="stat-box"><div className="stat-num">24/7</div><div style={{color: 'var(--color-text-muted)'}}>Design Support</div></div>
          </section>

          {/* Catalog */}
          <section id="shop" style={{maxWidth: 1340, margin: '0 auto 100px', padding: '0 32px'}}>
            <h2 style={{fontFamily: 'var(--font-serif)', fontSize: 36, marginBottom: 40}}>Trending Furniture</h2>
            <div className="product-grid">
              {INITIAL_PRODUCTS.map(p => (
                <div key={p.id} className="product-card">
                  <div className="product-image-container">
                    <img src={p.image} className="product-image" alt={p.name} />
                    <span className="product-badge">{p.badge}</span>
                  </div>
                  <div className="product-details">
                    <span style={{fontSize: 11, color: 'var(--color-text-light)', marginBottom: 4, textTransform: 'uppercase'}}>{p.category}</span>
                    <h3 style={{fontFamily: 'var(--font-serif)', fontSize: 19, fontWeight: 600, marginBottom: 4}}>{p.name}</h3>
                    <p style={{fontSize: 12, color: 'var(--color-text-muted)', marginBottom: 16}}>{p.specs}</p>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 'auto'}}>
                      <span style={{fontWeight: 'bold', fontSize: 18}}>{formatINR(p.price)}</span>
                      <button className="add-to-cart-btn" onClick={() => addToCart(p)}>Add to Cart</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Footer */}
          <footer className="site-footer">
            <div className="footer-grid">
              <div>
                <div className="brand-logo" style={{marginBottom: 20}}>
                  <div className="brand-mark">A</div>
                  <span className="brand-title">Aura</span>
                </div>
                <p style={{color: 'var(--color-text-light)', fontSize: 14}}>Elevating everyday spaces with mindful design and sustainable craftsmanship.</p>
              </div>
              <div>
                <h4 className="footer-title">Shop</h4>
                <ul className="footer-links">
                  <li><a href="#">Living Room</a></li><li><a href="#">Bedroom</a></li><li><a href="#">Lighting</a></li><li><a href="#">Decor</a></li>
                </ul>
              </div>
              <div>
                <h4 className="footer-title">Support</h4>
                <ul className="footer-links">
                  <li><a href="#">Contact Us</a></li><li><a href="#">Shipping & Returns</a></li><li><a href="#">FAQ</a></li><li><a href="#">Track Order</a></li>
                </ul>
              </div>
            </div>
          </footer>

          {/* Cart Drawer */}
          <div className={`cart-drawer-overlay ${isCartOpen ? 'open' : ''}`} onClick={() => setIsCartOpen(false)} />
          <aside className={`cart-drawer ${isCartOpen ? 'open' : ''}`}>
            <div className="drawer-header">
              <h2 style={{fontFamily: 'var(--font-serif)', fontSize: 24}}>Shopping Bag ({count})</h2>
              <button onClick={() => setIsCartOpen(false)} style={{fontSize: 24, cursor: 'pointer', background: 'none', border: 'none'}}>✕</button>
            </div>
            
            <div className="drawer-items">
              {cart.length === 0 ? (
                <div style={{textAlign: 'center', marginTop: 40, color: 'var(--color-text-muted)'}}>Your bag is empty.</div>
              ) : (
                cart.map(item => (
                  <div className="cart-item-row" key={item.id}>
                    <img src={item.image} className="cart-item-thumb" alt={item.name} />
                    <div style={{flex: 1, display: 'flex', flexDirection: 'column'}}>
                      <div style={{display: 'flex', justifyContent: 'space-between'}}>
                        <h4 style={{fontFamily: 'var(--font-serif)', fontWeight: 600}}>{item.name}</h4>
                        <button onClick={() => remove(item.id)} style={{cursor: 'pointer', background: 'none', border: 'none', fontSize: 18, color: 'var(--color-text-light)'}}>✕</button>
                      </div>
                      <p style={{fontSize: 12, color: 'var(--color-text-muted)'}}>{item.specs}</p>
                      
                      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 'auto'}}>
                        <div className="qty-stepper">
                          <button className="stepper-btn" onClick={() => updateQty(item.id, -1)} style={{cursor: 'pointer', border: 'none', background: 'none'}}>-</button>
                          <span style={{margin: '0 8px', fontSize: 14}}>{item.quantity}</span>
                          <button className="stepper-btn" onClick={() => updateQty(item.id, 1)} style={{cursor: 'pointer', border: 'none', background: 'none'}}>+</button>
                        </div>
                        <strong style={{fontSize: 15}}>{formatINR(item.price * item.quantity)}</strong>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>

            <div className="drawer-footer">
              <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 16, fontWeight: 'bold', fontSize: 18}}>
                <span>Subtotal</span><span>{formatINR(subtotal)}</span>
              </div>
              <p style={{fontSize: 12, color: 'var(--color-text-muted)', marginBottom: 16, textAlign: 'center'}}>Shipping and taxes calculated at checkout.</p>
              <button 
                className="btn-primary" 
                style={{width: '100%', justifyContent: 'center', height: 50, opacity: cart.length === 0 ? 0.5 : 1, pointerEvents: cart.length === 0 ? 'none' : 'auto'}} 
                onClick={() => window.location.href = 'checkout.html'}
              >
                Proceed to Secure Checkout
              </button>
            </div>
          </aside>

          {/* AI Chatbot Widget */}
          <div className="chatbot-widget">
            <div className={`chatbot-window ${isChatOpen ? 'open' : ''}`}>
              <div className="chatbot-header">
                <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
                  <i data-lucide="bot" style={{width: 18}}></i>
                  <span>Aura AI Assistant</span>
                </div>
                <button onClick={() => setIsChatOpen(false)} style={{color: 'white', fontSize: 18, background: 'none', border: 'none', cursor: 'pointer'}}>✕</button>
              </div>
              
              <div className="chatbot-messages">
                {messages.map((msg, idx) => (
                  <div key={idx} className={`message ${msg.sender}`}>
                    {msg.text}
                    {msg.image && (
                      <img src={msg.image} style={{width: '100%', marginTop: 8, borderRadius: 6}} alt="AI Generated Concept" />
                    )}
                  </div>
                ))}
                {isTyping && (
                  <div className="message bot" style={{color: 'gray', fontStyle: 'italic', fontSize: 12}}>
                    Thinking...
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>
              
              <div className="chatbot-input">
                <input 
                  type="text" 
                  placeholder="Ask about a product or request a custom design..." 
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  onKeyPress={handleKeyPress}
                  style={{outline: 'none'}}
                />
                <button onClick={sendMessage} disabled={isTyping} style={{cursor: isTyping ? 'not-allowed' : 'pointer', border: 'none'}}>Send</button>
              </div>
            </div>
            
            {!isChatOpen && (
              <button className="chatbot-toggle" onClick={() => setIsChatOpen(true)}>
                <i data-lucide="message-circle"></i>
              </button>
            )}
          </div>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
